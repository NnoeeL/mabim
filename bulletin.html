<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulletin Board | Kelompok 12</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1d2a22;
      --bg: #f7f1ea;
      --bg-2: #efe4d5;
      --panel: rgba(255, 255, 255, 0.72);
      --panel-strong: #fffaf6;
      --card: #ffffff;
      --muted: #607067;
      --line: rgba(29, 42, 34, 0.08);
      --clay: #d9795d;
      --clay-strong: #b85c40;
      --clay-soft: rgba(217, 121, 93, 0.12);
      --forest: #2f4b3d;
      --success: #2c7a59;
      --shadow: rgba(27, 37, 31, 0.08);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DM Sans", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(217, 121, 93, 0.18), transparent 28%),
        radial-gradient(circle at bottom right, rgba(47, 75, 61, 0.09), transparent 30%),
        linear-gradient(180deg, var(--bg) 0%, #f2e7dc 100%);
      position: relative;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.38;
      z-index: 0;
      pointer-events: none;
    }

    body::before {
      background: rgba(217, 121, 93, 0.15);
      top: -110px;
      right: -60px;
    }

    body::after {
      background: rgba(47, 75, 61, 0.12);
      bottom: -110px;
      left: -60px;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px 20px 72px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 0 18px;
      margin-bottom: 18px;
    }

    .brand {
      text-decoration: none;
      color: var(--forest);
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.18rem;
      text-transform: uppercase;
      opacity: 0.9;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      background: rgba(29, 42, 34, 0.96);
      color: #fff;
      border-radius: 999px;
      padding: 11px 18px;
      font-size: 0.9rem;
      font-weight: 700;
      transition: transform 180ms ease, box-shadow 180ms ease;
      box-shadow: 0 12px 24px rgba(29, 42, 34, 0.12);
    }

    .back-link:hover {
      transform: translateY(-1px);
    }

    .page-header {
      text-align: center;
      margin-bottom: 28px;
      padding-top: 8px;
    }

    .eyebrow {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--clay-soft);
      color: var(--clay-strong);
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.18rem;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 4vw, 3.6rem);
      line-height: 1.05;
      letter-spacing: -0.06em;
      color: var(--forest);
    }

    .subtitle {
      max-width: 720px;
      margin: 14px auto 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: 1rem;
    }

    .board-layout {
      display: grid;
      grid-template-columns: 0.92fr 1.28fr;
      gap: 24px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(29, 42, 34, 0.06);
      border-radius: 28px;
      box-shadow: 0 20px 45px var(--shadow);
      overflow: hidden;
    }

    .compose-panel {
      padding: 24px;
    }

    .panel-title {
      margin: 0 0 20px;
      font-size: 1.12rem;
      letter-spacing: -0.03em;
      color: var(--forest);
    }

    .form-grid {
      display: grid;
      gap: 18px;
    }

    label {
      display: grid;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--forest);
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid rgba(29, 42, 34, 0.1);
      background: rgba(255,255,255,0.7);
      border-radius: 16px;
      padding: 14px 16px;
      font: inherit;
      color: var(--ink);
      transition: border-color 180ms ease, box-shadow 180ms ease, transform 180ms ease;
    }

    input::placeholder,
    textarea::placeholder {
      color: rgba(96, 112, 103, 0.8);
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: rgba(217, 121, 93, 0.7);
      box-shadow: 0 0 0 4px rgba(217, 121, 93, 0.10);
      background: rgba(255,255,255,0.9);
    }

    textarea {
      min-height: 160px;
      resize: vertical;
    }

    .submit-btn {
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--clay), #e7a181);
      color: #fff;
      font-weight: 800;
      letter-spacing: 0.08rem;
      text-transform: uppercase;
      padding: 14px 20px;
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease;
      box-shadow: 0 12px 26px rgba(184, 92, 64, 0.25);
    }

    .submit-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 30px rgba(184, 92, 64, 0.28);
    }

    .status {
      min-height: 22px;
      margin-top: 4px;
      color: var(--success);
      font-weight: 700;
      font-size: 0.88rem;
    }

    .status.error {
      color: #b24d35;
    }

    .feed-panel {
      padding: 18px 18px 12px;
    }

    .feed-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 8px 18px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 14px;
    }

    .feed-head h2 {
      margin: 0;
      font-size: 1.2rem;
      letter-spacing: -0.04em;
      color: var(--forest);
    }

    .feed-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 42px;
      padding: 7px 10px;
      border-radius: 999px;
      background: var(--clay-soft);
      color: var(--clay-strong);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.06rem;
      text-transform: uppercase;
    }

    .comment-list {
      display: grid;
      gap: 14px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .comment-item {
      background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(247, 241, 234, 0.8));
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 18px 18px 16px;
      box-shadow: 0 10px 24px rgba(29, 42, 34, 0.04);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .comment-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 28px rgba(29, 42, 34, 0.06);
    }

    .comment-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .comment-name {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      color: var(--forest);
    }

    .comment-name::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--clay), #edb194);
      box-shadow: 0 0 0 5px rgba(217, 121, 93, 0.1);
    }

    .comment-time {
      color: var(--muted);
      font-size: 0.75rem;
      white-space: nowrap;
    }

    .comment-text {
      margin: 0;
      color: var(--ink);
      line-height: 1.7;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .empty-state {
      padding: 28px 20px;
      text-align: center;
      border: 1px dashed rgba(29, 42, 34, 0.18);
      border-radius: 18px;
      background: rgba(255,255,255,0.26);
      color: var(--muted);
      font-weight: 600;
    }

    .music-panel {
      position: fixed;
      right: 24px;
      top: 110px;
      width: 270px;
      background: linear-gradient(180deg, rgba(255,255,255,0.72), rgba(246,238,230,0.74));
      backdrop-filter: blur(16px);
      border: 1px solid rgba(29, 42, 34, 0.08);
      box-shadow: 0 20px 40px rgba(29, 42, 34, 0.08);
      border-radius: 24px;
      padding: 16px 14px 14px;
      z-index: 40;
      filter: saturate(0.72) contrast(0.96);
      transition: transform 200ms ease, box-shadow 200ms ease, border-color 200ms ease, filter 200ms ease;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }

    .music-panel.dragging {
      cursor: grabbing;
      transition: none;
    }

    .music-panel.playing {
      border-color: rgba(217, 121, 93, 0.2);
      box-shadow: 0 20px 42px rgba(184, 92, 64, 0.11);
      transform: translateY(-2px);
      filter: saturate(0.8) contrast(0.97);
    }

    .music-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.12rem;
      text-transform: uppercase;
      color: var(--clay-strong);
      margin-bottom: 12px;
    }

    .music-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .equalizer {
      display: inline-flex;
      align-items: end;
      gap: 3px;
      height: 14px;
    }

    .equalizer span {
      width: 4px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--clay), #efbca2);
      animation: pulseBar 1s ease-in-out infinite alternate;
      transform-origin: bottom;
    }

    .equalizer span:nth-child(1) { height: 7px; }
    .equalizer span:nth-child(2) { height: 10px; animation-delay: 0.2s; }
    .equalizer span:nth-child(3) { height: 13px; animation-delay: 0.4s; }

    @keyframes pulseBar {
      0% { transform: scaleY(0.6); opacity: 0.7; }
      100% { transform: scaleY(1); opacity: 1; }
    }

    .music-panel:not(.playing) .equalizer span {
      animation-play-state: paused;
      opacity: 0.5;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 68px;
      padding: 5px 8px;
      border-radius: 999px;
      background: rgba(29, 42, 34, 0.06);
      color: var(--ink);
      font-size: 0.64rem;
      font-weight: 700;
      letter-spacing: 0.08rem;
      text-transform: uppercase;
    }

    .music-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .album-art {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(217, 121, 93, 0.95), rgba(143, 174, 156, 0.9));
      position: relative;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.3);
    }

    .album-art::before {
      content: "♫";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 1.4rem;
      color: rgba(255,255,255,0.9);
    }

    .music-title {
      margin: 0;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12rem;
      color: var(--muted);
    }

    .music-track-name {
      margin: 4px 0 0;
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--forest);
      line-height: 1.4;
    }

    .music-progress {
      margin-bottom: 14px;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .progress-track {
      position: relative;
      width: 100%;
      height: 7px;
      background: rgba(29, 42, 34, 0.08);
      border-radius: 999px;
      overflow: hidden;
      cursor: pointer;
    }

    .progress-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--clay), #e8b09a);
    }

    .player-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .nav-btn,
    .play-toggle,
    .track-btn {
      font: inherit;
    }

    .nav-btn,
    .play-toggle {
      border: 0;
      cursor: pointer;
      border-radius: 999px;
      transition: transform 150ms ease, opacity 150ms ease;
    }

    .nav-btn {
      width: 34px;
      height: 34px;
      background: rgba(29, 42, 34, 0.06);
      color: var(--ink);
      font-size: 1.25rem;
      font-weight: 700;
    }

    .play-toggle {
      min-width: 112px;
      padding: 10px 18px;
      background: linear-gradient(135deg, var(--clay), #e29875);
      color: #fff;
      font-weight: 800;
      letter-spacing: 0.08rem;
      text-transform: uppercase;
    }

    .nav-btn:hover,
    .play-toggle:hover,
    .track-btn:hover {
      transform: translateY(-1px);
    }

    .track-list {
      display: grid;
      gap: 8px;
      margin-top: 8px;
    }

    .track-btn {
      display: block;
      width: 100%;
      text-align: left;
      border: 1px solid rgba(29, 42, 34, 0.08);
      background: rgba(255,255,255,0.22);
      color: var(--ink);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 150ms ease;
    }

    .track-btn.active {
      border-color: rgba(217, 121, 93, 0.8);
      background: rgba(217, 121, 93, 0.08);
      color: var(--clay-strong);
    }

    @media (max-width: 900px) {
      .board-layout {
        grid-template-columns: 1fr;
      }

      .container {
        padding-top: 18px;
      }

      .music-panel {
        position: static;
        width: min(100%, 420px);
        margin: 18px auto 0;
        right: auto;
        top: auto;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="topbar">
      <a href="index.html" class="brand">Kelompok 12</a>
      <a href="index.html" class="back-link">Kembali</a>
    </header>

    <aside class="music-panel" aria-label="Panel musik latar">
      <div class="music-head">
        <div class="music-badge">
          <div class="equalizer" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <span>Now</span>
        </div>
        <span class="status-pill" id="statusPill">Paused</span>
      </div>

      <div class="music-meta">
        <div class="album-art" aria-hidden="true"></div>
        <div>
          <p class="music-title">Current</p>
          <p class="music-track-name" id="currentTrackName">Shape of My Heart</p>
        </div>
      </div>

      <div class="music-progress" aria-label="Progress lagu">
        <div class="time-row">
          <span id="currentTimeLabel">0:00</span>
          <span id="durationLabel">0:00</span>
        </div>
        <div class="progress-track" id="progressTrack">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="player-controls">
        <button class="nav-btn" id="prevTrackBtn" aria-label="Lagu sebelumnya">‹</button>
        <button class="play-toggle" id="playToggle" aria-label="Putar musik">Play</button>
        <button class="nav-btn" id="nextTrackBtn" aria-label="Lagu berikutnya">›</button>
      </div>

      <div class="track-list">
        <button class="track-btn active" data-track="Shape of My Heart" data-src="assets/Backstreet Boys - Shape Of My Heart (Official HD Video).mp3">Shape of My Heart</button>
        <button class="track-btn" data-track="About You" data-src="assets/The 1975 - About You (Official).mp3">About You</button>
        <button class="track-btn" data-track="Merry Christmas I Miss You" data-src="assets/Merry Christmas, i miss you - Alex Crichton  Lirik Terjemahan Indonesia.mp3">Merry Christmas I Miss You</button>
      </div>

      <audio id="bgAudio" loop preload="auto"></audio>
    </aside>

    <section class="page-header">
      <div class="eyebrow">Bulletin Board</div>
      <h1>Papan Pesan Kelompok</h1>
      <p class="subtitle">Tulis nama Anda terlebih dahulu, lalu kirim komentar atau pesan singkat untuk membangun komunikasi lebih dekat dengan teman-teman kelompok.</p>
    </section>

    <main class="board-layout">
      <section class="panel compose-panel" aria-label="Form komentar">
        <h2 class="panel-title">Tulis Komentar</h2>
        <form id="commentForm" class="form-grid" novalidate>
          <label>
            Nama Anda
            <input id="nameInput" name="name" type="text" maxlength="40" placeholder="Masukkan nama lengkap Anda" required>
          </label>

          <label>
            Pesan
            <textarea id="messageInput" name="comment" placeholder="Tulis komentar, dukungan, atau pesan untuk kelompok..." required></textarea>
          </label>

          <button type="submit" class="submit-btn">Kirim Pesan</button>
          <div id="formStatus" class="status" aria-live="polite"></div>
        </form>
      </section>

      <section class="panel feed-panel" aria-label="Daftar komentar">
        <div class="feed-head">
          <h2>Pesan Terbaru</h2>
          <span id="commentCount" class="feed-count">0</span>
        </div>
        <ul id="commentList" class="comment-list"></ul>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2?v=2"></script>
  <script>
    const cacheBust = new Date().getTime();
    const supabaseUrl = 'https://hwejnbiudcwwfuhowrtp.supabase.co';
    const supabaseKey = 'sb_publishable_2eE7hTnPB6Ce0WAg45VNQA_pArsAZN2';

    const form = document.getElementById('commentForm');
    const nameInput = document.getElementById('nameInput');
    const messageInput = document.getElementById('messageInput');
    const formStatus = document.getElementById('formStatus');
    const commentList = document.getElementById('commentList');
    const commentCount = document.getElementById('commentCount');

    const db = window.supabase.createClient(supabaseUrl, supabaseKey);

    function setStatus(message, isError = false) {
      formStatus.textContent = message;
      formStatus.classList.toggle('error', isError);
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatDate(dateString) {
      const date = new Date(dateString);
      return new Intl.DateTimeFormat('id-ID', {
        day: 'numeric',
        month: 'short',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      }).format(date);
    }

    async function getAllComments() {
      const { data, error } = await db
        .from('comments')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) throw error;
      return data || [];
    }

    async function renderComments() {
      try {
        const comments = await getAllComments();
        commentCount.textContent = String(comments.length);

        if (!comments.length) {
          commentList.innerHTML = '<li class="empty-state">Belum ada komentar. Jadilah yang pertama menulis pesan.</li>';
          return;
        }

        commentList.innerHTML = comments.map((item) => `
          <li class="comment-item">
            <div class="comment-head">
              <span class="comment-name">${escapeHtml(item.name)}</span>
              <span class="comment-time">${formatDate(item.created_at)}</span>
            </div>
            <p class="comment-text">${escapeHtml(item.text)}</p>
          </li>
        `).join('');
      } catch (error) {
        commentList.innerHTML = '<li class="empty-state">Database komentar tidak bisa dimuat. Silakan cek konfigurasi Supabase.</li>';
        console.error(error);
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const name = nameInput.value.trim();
      const text = messageInput.value.trim();

      if (!name) {
        setStatus('Nama wajib diisi sebelum menulis komentar.', true);
        nameInput.focus();
        return;
      }

      if (!text) {
        setStatus('Pesan tidak boleh kosong.', true);
        messageInput.focus();
        return;
      }

      try {
        const { error } = await db.from('comments').insert([
          {
            name,
            text,
            created_at: new Date().toISOString()
          }
        ]);

        if (error) throw error;

        form.reset();
        setStatus('Komentar berhasil dikirim. Memuat pembaruan...');
        await renderComments();
        setStatus('Komentar berhasil dikirim.');
      } catch (error) {
        setStatus('Komentar gagal dikirim. Cek konfigurasi database Supabase.', true);
        console.error(error);
      }
    });

    async function initBulletin() {
      if (!window.supabase) {
        setTimeout(initBulletin, 500);
        return;
      }

      await renderComments();
    }

    window.addEventListener('load', initBulletin);
    window.addEventListener('focus', () => renderComments().catch(() => {}));
    setInterval(() => {
      renderComments().catch(() => {});
    }, 5000);

    const currentUrl = new URL(window.location.href);
    currentUrl.searchParams.set('v', String(cacheBust));
    if (currentUrl.search !== window.location.search) {
      history.replaceState({}, '', currentUrl);
    }

    initBulletin().catch(() => {});
    const audio = document.getElementById('bgAudio');
    const buttons = [...document.querySelectorAll('.track-btn')];
    const playToggle = document.getElementById('playToggle');
    const prevTrackBtn = document.getElementById('prevTrackBtn');
    const nextTrackBtn = document.getElementById('nextTrackBtn');
    const progressTrack = document.getElementById('progressTrack');
    const musicPanel = document.querySelector('.music-panel');
    const currentTrackName = document.getElementById('currentTrackName');
    const statusPill = document.getElementById('statusPill');
    const currentTimeLabel = document.getElementById('currentTimeLabel');
    const durationLabel = document.getElementById('durationLabel');
    const progressFill = document.getElementById('progressFill');
    const STORAGE_KEY = 'mabim_music_state';

    function formatTime(totalSeconds) {
      if (!Number.isFinite(totalSeconds) || totalSeconds < 0) return '0:00';
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = Math.floor(totalSeconds % 60).toString().padStart(2, '0');
      return `${minutes}:${seconds}`;
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function getSavedMusicState() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      } catch (error) {
        return {};
      }
    }

    function syncTrackLabel() {
      const activeTrack = document.querySelector('.track-btn.active');
      if (currentTrackName && activeTrack) {
        currentTrackName.textContent = activeTrack.dataset.track || 'Unknown track';
      }
    }

    function updateProgressBar() {
      if (!Number.isFinite(audio.duration) || audio.duration <= 0) {
        durationLabel.textContent = '0:00';
        currentTimeLabel.textContent = '0:00';
        progressFill.style.width = '0%';
        return;
      }

      const progress = (audio.currentTime / audio.duration) * 100;
      progressFill.style.width = `${progress}%`;
      currentTimeLabel.textContent = formatTime(audio.currentTime);
      durationLabel.textContent = formatTime(audio.duration);
    }

    function saveMusicState() {
      const activeTrack = document.querySelector('.track-btn.active');
      const state = {
        src: activeTrack ? activeTrack.dataset.src : audio.src,
        playing: !audio.paused && Boolean(audio.src),
        currentTime: Number.isFinite(audio.currentTime) ? audio.currentTime : 0
      };

      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (error) {
        console.warn('Music state could not be saved:', error);
      }
    }

    function updateMusicState(isPlaying) {
      playToggle.textContent = isPlaying ? 'Pause' : 'Play';
      musicPanel.classList.toggle('playing', isPlaying);
      statusPill.textContent = isPlaying ? 'Playing' : 'Paused';
      syncTrackLabel();
      updateProgressBar();
    }

    function playAudio() {
      if (!audio.src) return;
      audio.muted = false;
      audio.volume = 0.7;
      audio.play().catch(() => {
        document.addEventListener('pointerdown', () => {
          if (audio.paused) audio.play();
        }, { once: true });
      });
      updateMusicState(true);
      saveMusicState();
    }

    function loadTrack(button) {
      buttons.forEach((btn) => btn.classList.toggle('active', btn === button));
      audio.src = encodeURI(button.dataset.src);
      audio.load();
      audio.currentTime = 0;
      syncTrackLabel();
      playAudio();
      saveMusicState();
    }

    function moveTrack(step) {
      const activeIndex = buttons.findIndex((button) => button.classList.contains('active'));
      const nextIndex = (activeIndex + step + buttons.length) % buttons.length;
      loadTrack(buttons[nextIndex]);
    }

    function seekTrack(event) {
      if (!Number.isFinite(audio.duration) || audio.duration <= 0) return;
      const rect = progressTrack.getBoundingClientRect();
      const ratio = clamp((event.clientX - rect.left) / rect.width, 0, 1);
      audio.currentTime = ratio * audio.duration;
      updateProgressBar();
      saveMusicState();
    }

    buttons.forEach((button) => {
      button.addEventListener('click', () => loadTrack(button));
    });

    playToggle.addEventListener('click', () => {
      if (audio.paused) {
        playAudio();
      } else {
        audio.pause();
        updateMusicState(false);
        saveMusicState();
      }
    });

    prevTrackBtn.addEventListener('click', () => moveTrack(-1));
    nextTrackBtn.addEventListener('click', () => moveTrack(1));
    progressTrack.addEventListener('click', seekTrack);

    let dragState = null;
    musicPanel.addEventListener('pointerdown', (event) => {
      if (event.target.closest('.track-btn') || event.target.closest('.play-toggle')) {
        return;
      }
      dragState = {
        offsetX: event.clientX - musicPanel.getBoundingClientRect().left,
        offsetY: event.clientY - musicPanel.getBoundingClientRect().top
      };
      musicPanel.classList.add('dragging');
      musicPanel.setPointerCapture(event.pointerId);
    });

    musicPanel.addEventListener('pointermove', (event) => {
      if (!dragState) return;
      const maxX = window.innerWidth - musicPanel.offsetWidth - 12;
      const maxY = window.innerHeight - musicPanel.offsetHeight - 12;
      const nextLeft = clamp(event.clientX - dragState.offsetX, 12, Math.max(12, maxX));
      const nextTop = clamp(event.clientY - dragState.offsetY, 12, Math.max(12, maxY));
      musicPanel.style.left = `${nextLeft}px`;
      musicPanel.style.top = `${nextTop}px`;
      musicPanel.style.right = 'auto';
    });

    ['pointerup', 'pointercancel', 'pointerleave'].forEach((eventName) => {
      musicPanel.addEventListener(eventName, () => {
        if (!dragState) return;
        dragState = null;
        musicPanel.classList.remove('dragging');
      });
    });

    function restoreSavedMusicState() {
      const saved = getSavedMusicState();
      const savedButton = saved.src
        ? buttons.find((button) => button.dataset.src === saved.src)
        : null;
      const firstTrack = savedButton || buttons[0];

      if (!firstTrack) return;

      buttons.forEach((button) => button.classList.toggle('active', button === firstTrack));
      audio.src = encodeURI(firstTrack.dataset.src);
      syncTrackLabel();
      audio.load();

      audio.addEventListener('loadedmetadata', () => {
        const savedTime = Number(saved.currentTime) || 0;
        if (Number.isFinite(audio.duration) && audio.duration > 0) {
          audio.currentTime = Math.min(savedTime, audio.duration - 0.1);
        }

        if (saved.playing) {
          playAudio();
        } else {
          updateMusicState(false);
        }
      }, { once: true });
    }

    audio.addEventListener('timeupdate', () => {
      updateProgressBar();
      saveMusicState();
    });
    audio.addEventListener('loadedmetadata', updateProgressBar);
    audio.addEventListener('play', () => saveMusicState());
    audio.addEventListener('pause', () => saveMusicState());
    window.addEventListener('beforeunload', saveMusicState);

    restoreSavedMusicState();  </script>
</body>
</html>
