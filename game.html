<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose Your Character</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg-1: #dde9d7;
        --bg-2: #bfd0bf;
        --panel: #f7f3e9;
        --panel-border: #2d2d2d;
        --ink: #1b2b2a;
        --accent: #d46b48;
        --accent-2: #8ab9a2;
        --soft: #edf3ea;
        --card: #e7efd8;
        --shadow: rgba(29, 43, 43, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
        color: var(--ink);
        font-family: "Press Start 2P", monospace;
      }

      body {
        min-height: 100vh;
      }

      .page {
        max-width: 1280px;
        margin: 0 auto;
        padding: 32px 20px 54px;
      }

      .site-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 42px;
        padding: 16px 22px;
        border: 1px solid rgba(36, 49, 40, 0.1);
        border-radius: 999px;
        background: rgba(255, 253, 249, 0.94);
        box-shadow: 0 10px 28px rgba(36, 49, 40, 0.06);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .site-brand {
        flex-shrink: 0;
        color: #243128;
        font-size: 0.95rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-decoration: none;
      }

      .site-links {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 8px 22px;
        font-size: 0.88rem;
        font-weight: 600;
      }

      .site-links a {
        color: #526057;
        text-decoration: none;
        transition: color 160ms ease;
      }

      .site-links a:hover,
      .site-links a[aria-current="page"] {
        color: #bf5d43;
      }

      .title-wrap {
        text-align: center;
        margin-bottom: 28px;
      }

      .title-wrap h1 {
        margin: 0;
        font-size: clamp(1.2rem, 2vw, 2.2rem);
        line-height: 1.6;
        letter-spacing: 0.12em;
        text-shadow: 4px 4px 0 rgba(255,255,255,0.9);
      }

      .subtitle {
        margin-top: 18px;
        font-size: 0.54rem;
        letter-spacing: 0.16em;
        color: rgba(27, 43, 42, 0.8);
      }

      .layout {
        display: grid;
        grid-template-columns: 1.5fr 0.8fr;
        gap: 24px;
        align-items: start;
      }

      .panel {
        background: rgba(247, 243, 233, 0.95);
        border: 4px solid var(--panel-border);
        box-shadow: 10px 10px 0 var(--shadow);
      }

      .character-panel {
        padding: 18px;
      }

      .character-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 18px;
      }

      .character-card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 210px;
        padding: 12px 10px 14px;
        background: var(--card);
        border: 4px solid var(--panel-border);
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.12);
        cursor: pointer;
        transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease;
      }

      .character-card:hover {
        transform: translate(-2px, -2px);
        box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.15);
      }

      .character-card.selected {
        background: #f9ebd9;
        border-color: var(--accent);
        box-shadow: 8px 8px 0 rgba(212, 107, 72, 0.42);
        transform: translate(-3px, -3px) scale(1.02);
      }

      .character-card.selected .sprite-box {
        animation: bounceCharacter 0.5s ease;
      }

      .character-card.selected .role-badge {
        background: #ffe1c7;
      }

      .sprite-box {
        width: 96px;
        height: 96px;
        margin-bottom: 12px;
        border: 4px solid var(--panel-border);
        background-repeat: no-repeat;
        background-position: center center;
        background-size: contain;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        background-color: #dfe9d8;
        transition: transform 0.18s ease, filter 0.18s ease;
      }

      .character-card.selected .sprite-box {
        filter: drop-shadow(0 0 8px rgba(212, 107, 72, 0.5));
      }

      .character-name {
        min-height: 4.2em;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 0.42rem;
        line-height: 1.8;
        letter-spacing: 0.04em;
        color: var(--ink);
      }

      .role-badge {
        display: inline-block;
        margin-top: 4px;
        padding: 6px 8px;
        font-size: 0.34rem;
        line-height: 1.5;
        background: #f0dcc7;
        border: 3px solid var(--panel-border);
      }

      .preview-panel {
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .preview-box {
        background: linear-gradient(180deg, #f2f0e6 0%, #e4efe1 100%);
        border: 4px solid var(--panel-border);
        padding: 16px 16px 18px;
        min-height: 290px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .preview-sprite {
        width: 160px;
        height: 160px;
        margin: 0 auto 18px;
        border: 4px solid var(--panel-border);
        background-repeat: no-repeat;
        background-position: center center;
        background-size: contain;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        background-color: #dfe9d8;
        transition: transform 0.2s ease;
      }

      .preview-box.active .preview-sprite {
        animation: previewBounce 0.45s ease;
      }

      .preview-name {
        text-align: center;
        font-size: 0.62rem;
        line-height: 1.9;
        margin-bottom: 12px;
      }

      .preview-role {
        text-align: center;
        font-size: 0.42rem;
        line-height: 1.8;
        color: rgba(27, 43, 42, 0.8);
      }

      .confirm-btn {
        width: 100%;
        padding: 16px 18px;
        background: var(--accent);
        border: 4px solid var(--panel-border);
        color: #fff;
        font-family: "Press Start 2P", monospace;
        font-size: 0.5rem;
        cursor: pointer;
        box-shadow: 6px 6px 0 rgba(29, 43, 43, 0.18);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      .confirm-btn:hover {
        transform: translate(-2px, -2px);
        box-shadow: 8px 8px 0 rgba(29, 43, 43, 0.18);
      }

      @keyframes bounceCharacter {
        0%   { transform: scale(1) translateY(0); }
        30%  { transform: scale(1.12) translateY(-4px); }
        65%  { transform: scale(0.96) translateY(2px); }
        100% { transform: scale(1); }
      }

      @keyframes previewBounce {
        0%   { transform: scale(1) rotate(0deg); }
        25%  { transform: scale(1.08) rotate(-2deg); }
        50%  { transform: scale(1.12) rotate(2deg); }
        100% { transform: scale(1) rotate(0deg); }
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 680px) {
        .site-nav {
          align-items: flex-start;
          flex-direction: column;
          gap: 14px;
          padding: 16px 18px;
          border-radius: 20px;
          margin-bottom: 32px;
        }

        .site-links {
          justify-content: flex-start;
          gap: 8px 16px;
        }

        .character-grid {
          grid-template-columns: repeat(2, minmax(130px, 1fr));
        }
      }
    </style>
    <link rel="stylesheet" href="assets/site.css">
  </head>
  <body>
    <div class="page">
      <nav class="site-nav" aria-label="Navigasi utama">
        <a href="index.html" class="site-brand">Kelompok 12</a>
        <div class="site-links">
          <a href="index.html">Home</a>
          <a href="index.html#about">About</a>
          <a href="index.html#anggota">Anggota</a>
          <a href="gallery.html">Galeri</a>
          <a href="bulletin.html">Bulletin</a>
          <a href="game.html" aria-current="page">Game</a>
        </div>
      </nav>
      <div class="title-wrap">
        <h1>CHOOSE YOUR CHARACTER</h1>
        <div class="subtitle">PILIH KARAKTER FAVORITMU</div>
      </div>

      <div class="layout">
        <section class="panel character-panel" aria-label="Daftar karakter">
          <div class="character-grid" id="characterGrid"></div>
        </section>

        <aside class="panel preview-panel" aria-label="Preview karakter">
          <div class="preview-box" id="previewBox">
            <div class="preview-sprite" id="previewSprite"></div>
            <div class="preview-name" id="previewName">Radhitya Fauzana Rasyid</div>
            <div class="preview-role" id="previewRole">Ketua</div>
          </div>

          <button type="button" class="confirm-btn" onclick="window.location.href='game-menu.html'">START QUEST</button>
        </aside>
      </div>
    </div>

    <script>
      const characters = [
        { name: 'Ghania Citra Karini', role: 'Kaka Asuh', image: 'assets/game-character-01.png' },
        { name: 'Indah Kasih Lestari', role: 'Kaka Asuh', image: 'assets/game-character-02.png' },
        { name: 'Radhitya Fauzana Rasyid', role: 'Ketua', image: 'assets/game-character-03.png' },
        { name: 'Winda Nur Fadilah', role: 'Anggota', image: 'assets/game-character-04.png' },
        { name: 'Muhammad Farrel Fachridho', role: 'Anggota', image: 'assets/game-character-05.png' },
        { name: 'Aldi Muhamad Alfaisi', role: 'Anggota', image: 'assets/game-character-06.png' },
        { name: 'Efqi \'Asykarullah', role: 'Anggota', image: 'assets/game-character-07.png' },
        { name: 'Defnika Adistya Fadianti', role: 'Anggota', image: 'assets/game-character-08.png' },
        { name: 'Nanda Ahmad Hanani', role: 'Anggota', image: 'assets/game-character-09.png' },
        { name: 'Aditya Dwi Putra', role: 'Anggota', image: 'assets/game-character-10.png' },
        { name: 'Muhammad Daris Ghifari', role: 'Anggota', image: 'assets/game-character-11.png' },
        { name: 'M Alief Rievan R', role: 'Anggota', image: 'assets/game-character-12.png' },
        { name: 'Muhammad Ihsan Sya’bana', role: 'Anggota', image: 'assets/game-character-12.png' }
      ];

      const grid = document.getElementById('characterGrid');
      const previewBox = document.getElementById('previewBox');
      const previewSprite = document.getElementById('previewSprite');
      const previewName = document.getElementById('previewName');
      const previewRole = document.getElementById('previewRole');

      function selectCharacter(character, card) {
        const cards = document.querySelectorAll('.character-card');
        cards.forEach((item) => item.classList.remove('selected'));
        card.classList.add('selected');

        previewName.textContent = character.name;
        previewRole.textContent = character.role;
        previewSprite.style.backgroundImage = `url("${character.image}")`;

        localStorage.setItem('selectedCharacter', JSON.stringify(character));

        previewBox.classList.remove('active');
        void previewBox.offsetWidth;
        previewBox.classList.add('active');
      }

      function renderCharacters() {
        const savedCharacter = (() => {
          try {
            const stored = localStorage.getItem('selectedCharacter');
            return stored ? JSON.parse(stored) : null;
          } catch (error) {
            return null;
          }
        })();

        characters.forEach((character, index) => {
          const card = document.createElement('button');
          card.type = 'button';
          card.className = 'character-card';
          card.setAttribute('aria-label', `Pilih karakter ${character.name}`);

          const sprite = document.createElement('div');
          sprite.className = 'sprite-box';
          sprite.style.backgroundImage = `url("${character.image}")`;

          const name = document.createElement('div');
          name.className = 'character-name';
          name.textContent = character.name;

          const role = document.createElement('div');
          role.className = 'role-badge';
          role.textContent = character.role;

          card.appendChild(sprite);
          card.appendChild(name);
          card.appendChild(role);

          card.addEventListener('click', () => selectCharacter(character, card));

          const shouldSelect = savedCharacter ? character.name === savedCharacter.name : index === 2;
          if (shouldSelect) {
            selectCharacter(character, card);
          }

          grid.appendChild(card);
        });
      }

      renderCharacters();
    </script>
    <script src="assets/site.js" defer></script>
  </body>
</html>
