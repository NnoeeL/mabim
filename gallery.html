<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeri Kegiatan - Kelompok 12</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #243128;
      --clay: #bf5d43;
      --cream: #fbf7ef;
      --card: #fffdf9;
      --line: rgba(36, 49, 40, 0.1);
      --muted: #657168;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: "DM Sans", "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--cream);
    }

    a { color: inherit; text-decoration: none; }

    .site-header {
      padding: 24px clamp(20px, 5vw, 72px) 0;
    }

    .site-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 22px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 10px 28px rgba(36, 49, 40, 0.04);
    }

    .brand {
      flex-shrink: 0;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    .nav-links {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px 22px;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 600;
    }

    .nav-link { transition: color 160ms ease; }
    .nav-link:hover, .nav-link[aria-current="page"] { color: var(--clay); }

    .gallery-shell {
      width: min(100% - 40px, 1000px);
      margin: 0 auto;
      padding: clamp(56px, 8vw, 88px) 0 88px;
    }

    .gallery-header { margin-bottom: 32px; }

    .gallery-eyebrow {
      margin: 0 0 12px;
      color: var(--clay);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.25rem);
      letter-spacing: -0.05em;
      line-height: 1.08;
    }

    .gallery-intro {
      max-width: 600px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.7;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
    }

    .gallery-card {
      min-width: 0;
      margin: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--card);
      box-shadow: 0 14px 32px rgba(36, 49, 40, 0.06);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .gallery-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 20px 38px rgba(36, 49, 40, 0.1);
    }

    .gallery-card img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #efe2d2;
    }

    .gallery-card figcaption {
      padding: 14px 18px;
      font-size: 0.95rem;
      font-weight: 700;
    }

    @media (max-width: 640px) {
      .site-nav {
        align-items: flex-start;
        flex-direction: column;
        gap: 14px;
        padding: 16px 18px;
        border-radius: 20px;
      }

      .nav-links { justify-content: flex-start; gap: 8px 16px; }
      .gallery-grid { grid-template-columns: 1fr; gap: 16px; }
      .gallery-shell { padding-top: 52px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <nav aria-label="Navigasi utama" class="site-nav">
        <a href="index.html" class="brand">Kelompok 12</a>
        <div class="nav-links">
          <a href="index.html" class="nav-link">Home</a>
          <a href="index.html#about" class="nav-link">About</a>
          <a href="index.html#anggota" class="nav-link">Anggota</a>
          <a href="gallery.html" class="nav-link" aria-current="page">Galeri</a>
          <a href="bulletin.html" class="nav-link">Bulletin</a>
          <a href="game.html" class="nav-link">Game</a>
        </div>
      </nav>
    </header>

    <main class="gallery-shell">
      <div class="gallery-header">
        <p class="gallery-eyebrow">Kelompok 12 | Mabim</p>
        <h1>Galeri Kegiatan</h1>
        <p class="gallery-intro">Kumpulan momen kebersamaan kami selama MABIM dan mentoring.</p>
      </div>

      <section class="gallery-grid" aria-label="Foto kegiatan kelompok">
        <figure class="gallery-card">
          <img src="assets/MABIM/poto1.jpeg" alt="Kebersamaan kelompok saat kegiatan MABIM" loading="lazy">
          <figcaption>Kegiatan MABIM</figcaption>
        </figure>
        <figure class="gallery-card">
          <img src="assets/MENTORING/MENTORING 1.jpeg" alt="Kegiatan mentoring kelompok" loading="lazy">
          <figcaption>Kegiatan Mentoring</figcaption>
        </figure>
      </section>
    </main>
  </div>

  <script src="assets/site.js" defer></script>
</body>
</html>
