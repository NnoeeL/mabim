<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeri Kegiatan - Kelompok 12</title>
  <script src="https://cdn.tailwindcss.com/3.4.17" type="text/javascript"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js" type="text/javascript"></script>
  <style>
    :root {
      --ink: #243128;
      --clay: #bf5d43;
      --sand: #efe2d2;
      --warm: #f7efe7;
      --sage: #9ebea1;
      --rose: #f4d7d0;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, #fdf9f2 0%, #f8f1e8 100%);
      color: var(--ink);
    }

    a { text-decoration: none; }

    .page-shell {
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      background:
        radial-gradient(circle at top left, rgba(191, 93, 67, 0.07), transparent 28%),
        radial-gradient(circle at bottom right, rgba(146, 194, 170, 0.1), transparent 28%);
    }

    .nav-link {
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .nav-link:hover {
      opacity: 0.8;
      transform: translateY(-1px);
    }

    .gallery-shell {
      max-width: 1200px;
      margin: 0 auto;
      padding: 80px 24px 80px;
    }

    .gallery-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .gallery-header p {
      margin: 0;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--clay);
    }

    .gallery-header h1 {
      margin: 18px 0 10px;
      font-size: clamp(2.2rem, 5vw, 4rem);
      font-weight: 800;
      letter-spacing: -0.05em;
      color: var(--ink);
    }

    .gallery-header .subtitle {
      margin: 0 auto;
      max-width: 720px;
      font-size: 1.05rem;
      line-height: 1.7;
      color: rgba(36, 49, 40, 0.7);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 18px;
    }

    .gallery-card {
      position: relative;
      overflow: hidden;
      border-radius: 1.7rem;
      background: rgba(255,255,255,0.6);
      border: 1px solid rgba(36, 49, 40, 0.08);
      box-shadow: 0 20px 36px rgba(36, 49, 40, 0.08);
      transition: transform 240ms ease, box-shadow 240ms ease;
      min-height: 260px;
    }

    .gallery-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 22px 40px rgba(36, 49, 40, 0.12);
    }

    .gallery-card.large {
      grid-column: span 7;
      min-height: 420px;
    }

    .gallery-card.medium {
      grid-column: span 5;
      min-height: 420px;
    }

    .gallery-card.small {
      grid-column: span 4;
      min-height: 300px;
    }

    .gallery-card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 300ms ease;
    }

    .gallery-card:hover img {
      transform: scale(1.04);
    }

    .gallery-overlay {
      position: absolute;
      inset: auto 0 0 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 18px 16px;
      background: linear-gradient(180deg, rgba(21, 27, 22, 0), rgba(21, 27, 22, 0.7));
      color: white;
    }

    .gallery-title {
      font-size: 1rem;
      font-weight: 700;
    }

    .gallery-tag {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.14);
      font-size: 0.64rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      backdrop-filter: blur(6px);
    }

    @media (max-width: 768px) {
      .gallery-card.large,
      .gallery-card.medium,
      .gallery-card.small {
        grid-column: 1 / -1;
        min-height: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="w-full px-6 py-6 md:px-12 lg:px-20">
      <nav aria-label="Navigasi utama" class="mx-auto flex max-w-7xl items-center justify-between gap-6">
        <a href="index.html" class="text-lg font-bold tracking-[0.16em]" style="color: var(--ink);">Kelompok 12</a>
        <div class="flex items-center gap-4 text-sm font-medium sm:gap-7">
          <a href="index.html" class="nav-link" style="color: var(--ink);">Home</a>
          <a href="index.html#about" class="nav-link" style="color: var(--ink);">About</a>
          <a href="gallery.html" class="nav-link" style="color: var(--ink);">Galeri</a>
        </div>
      </nav>
    </header>

    <main class="gallery-shell">
      <div class="gallery-header">
        <p>Galeri</p>
        <h1>Galeri Kegiatan Kelompok</h1>
        <p class="subtitle">Beberapa momen penting yang menggambarkan semangat kerja sama, belajar, dan kebersamaan kami dalam satu kelompok.</p>
      </div>

      <section class="gallery-grid" aria-label="Galeri kegiatan kelompok 12">
        <figure class="gallery-card large">
          <img src="assets/poto1.jpeg" alt="Kegiatan pertama kelompok 12">
          <figcaption class="gallery-overlay">
            <span class="gallery-title">Diskusi Tim</span>
            <span class="gallery-tag">01</span>
          </figcaption>
        </figure>

        <figure class="gallery-card medium">
          <img src="assets/poto2.jpeg" alt="Kegiatan belajar bersama kelompok 12">
          <figcaption class="gallery-overlay">
            <span class="gallery-title">Belajar Bareng</span>
            <span class="gallery-tag">02</span>
          </figcaption>
        </figure>

        <figure class="gallery-card small">
          <img src="assets/poto3.jpeg" alt="Kegiatan kerja sama kelompok 12">
          <figcaption class="gallery-overlay">
            <span class="gallery-title">Kerja Sama</span>
            <span class="gallery-tag">03</span>
          </figcaption>
        </figure>

        <figure class="gallery-card small">
          <img src="assets/poto4.jpeg" alt="Foto bersama kelompok 12">
          <figcaption class="gallery-overlay">
            <span class="gallery-title">Bersama</span>
            <span class="gallery-tag">04</span>
          </figcaption>
        </figure>
      </section>
    </main>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
