<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeri Kegiatan - Kelompok 12</title>
  <script src="https://cdn.tailwindcss.com/3.4.17" type="text/javascript"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js" type="text/javascript"></script>
  <style>
    :root {
      --ink: #243128;
      --clay: #bf5d43;
      --sand: #efe2d2;
      --warm: #f7efe7;
      --sage: #9ebea1;
      --rose: #f4d7d0;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, #fdf9f2 0%, #f8f1e8 100%);
      color: var(--ink);
    }

    a { text-decoration: none; }

    .page-shell {
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      background:
        radial-gradient(circle at top left, rgba(191, 93, 67, 0.07), transparent 28%),
        radial-gradient(circle at bottom right, rgba(146, 194, 170, 0.1), transparent 28%);
    }

    .nav-link {
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .nav-link:hover {
      opacity: 0.8;
      transform: translateY(-1px);
    }

    .gallery-shell {
      max-width: 1200px;
      margin: 0 auto;
      padding: 80px 24px 80px;
    }

    .gallery-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .gallery-header p {
      margin: 0;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--clay);
    }

    .gallery-header h1 {
      margin: 18px 0 10px;
      font-size: clamp(2.2rem, 5vw, 4rem);
      font-weight: 800;
      letter-spacing: -0.05em;
      color: var(--ink);
    }

    .gallery-header .subtitle {
      margin: 0 auto;
      max-width: 720px;
      font-size: 1.05rem;
      line-height: 1.7;
      color: rgba(36, 49, 40, 0.7);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 18px;
    }

    .gallery-card {
      position: relative;
      overflow: hidden;
      border-radius: 1.7rem;
      background: rgba(255,255,255,0.6);
      border: 1px solid rgba(36, 49, 40, 0.08);
      box-shadow: 0 20px 36px rgba(36, 49, 40, 0.08);
      transition: transform 240ms ease, box-shadow 240ms ease;
      min-height: 260px;
    }

    .gallery-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 22px 40px rgba(36, 49, 40, 0.12);
    }

    .gallery-card.large {
      grid-column: span 7;
      min-height: 420px;
    }

    .gallery-card.medium {
      grid-column: span 5;
      min-height: 420px;
    }

    .gallery-card.small {
      grid-column: span 4;
      min-height: 300px;
    }

    .gallery-card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 300ms ease;
    }

    .gallery-card:hover img {
      transform: scale(1.04);
    }

    .gallery-overlay {
      position: absolute;
      inset: auto 0 0 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 18px 16px;
      background: linear-gradient(180deg, rgba(21, 27, 22, 0), rgba(21, 27, 22, 0.7));
      color: white;
    }

    .gallery-title {
      font-size: 1rem;
      font-weight: 700;
    }

    .gallery-tag {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.14);
      font-size: 0.64rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      backdrop-filter: blur(6px);
    }

    .music-panel {
      position: fixed;
      right: 24px;
      top: 120px;
      width: 260px;
      background: linear-gradient(180deg, rgba(255,255,255,0.72), rgba(246,238,230,0.74));
      backdrop-filter: blur(16px);
      border: 1px solid rgba(36, 49, 40, 0.08);
      box-shadow: 0 20px 40px rgba(36, 49, 40, 0.08);
      border-radius: 24px;
      padding: 16px 14px 14px;
      z-index: 20;
      filter: saturate(0.72) contrast(0.96);
      transition: transform 200ms ease, box-shadow 200ms ease, border-color 200ms ease, filter 200ms ease;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }

    .music-panel.dragging {
      cursor: grabbing;
      transition: none;
    }

    .music-panel.playing {
      border-color: rgba(191, 93, 67, 0.2);
      box-shadow: 0 20px 42px rgba(191, 93, 67, 0.11);
      transform: translateY(-2px);
      filter: saturate(0.8) contrast(0.97);
    }

    .music-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.12rem;
      text-transform: uppercase;
      color: var(--clay);
      margin-bottom: 12px;
    }

    .music-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 68px;
      padding: 5px 8px;
      border-radius: 999px;
      background: rgba(36, 49, 40, 0.06);
      color: var(--ink);
      font-size: 0.64rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      transition: all 180ms ease;
    }

    .music-panel.playing .status-pill {
      background: rgba(191, 93, 67, 0.12);
      color: var(--clay);
    }

    .equalizer {
      display: flex;
      align-items: end;
      gap: 3px;
      height: 16px;
      padding: 2px 0;
    }

    .equalizer span {
      display: block;
      width: 4px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--clay), #d18d6a);
      animation: equalize 1s ease-in-out infinite alternate;
      transform-origin: bottom;
      opacity: 0.4;
    }

    .equalizer span:nth-child(1) { height: 6px; animation-delay: 0.1s; }
    .equalizer span:nth-child(2) { height: 12px; animation-delay: 0.2s; }
    .equalizer span:nth-child(3) { height: 9px; animation-delay: 0.4s; }

    .music-panel.playing .equalizer span {
      opacity: 1;
    }

    .music-panel:not(.playing) .equalizer span {
      opacity: 0.32;
      animation: none;
    }

    .music-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 10px;
      border-radius: 16px;
      background: rgba(36,49,40,0.03);
      border: 1px solid rgba(36,49,40,0.06);
      margin-bottom: 12px;
    }

    .music-progress {
      margin-bottom: 12px;
      padding: 0 6px;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      color: rgba(36, 49, 40, 0.68);
      font-size: 0.64rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 7px;
    }

    .progress-track {
      position: relative;
      height: 7px;
      width: 100%;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(36, 49, 40, 0.08);
      cursor: pointer;
    }

    .progress-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--clay), #d18d6a, #f0c492);
      box-shadow: 0 0 12px rgba(191, 93, 67, 0.26);
    }

    .player-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 10px 0 12px;
    }

    .nav-btn {
      width: 32px;
      height: 32px;
      border: 1px solid rgba(36, 49, 40, 0.08);
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      color: var(--ink);
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 180ms ease;
    }

    .nav-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(191, 93, 67, 0.2);
      background: rgba(191, 93, 67, 0.08);
    }

    .album-art {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--clay), #d18d6a 55%, #f2d0b6);
      box-shadow: inset 0 0 14px rgba(255,255,255,0.18), 0 8px 18px rgba(191,93,67,0.22);
      position: relative;
      overflow: hidden;
    }

    .album-art::before,
    .album-art::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.62);
    }

    .album-art::before {
      width: 20px;
      height: 20px;
      inset: 16px 12px auto auto;
    }

    .album-art::after {
      width: 8px;
      height: 8px;
      inset: auto auto 10px 12px;
      background: rgba(255,255,255,0.75);
      border: none;
    }

    .music-title {
      margin: 0;
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(36,49,40,0.7);
    }

    .music-track-name {
      margin: 4px 0 0;
      font-size: 0.9rem;
      font-weight: 700;
      line-height: 1.3;
      color: var(--ink);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .track-list {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }

    .track-btn {
      border: 1px solid rgba(36, 49, 40, 0.08);
      background: rgba(36, 49, 40, 0.02);
      color: var(--ink);
      border-radius: 12px;
      padding: 10px 12px;
      font: inherit;
      font-size: 0.8rem;
      text-align: left;
      cursor: pointer;
      transition: all 180ms ease;
    }

    .track-btn:hover,
    .track-btn.active {
      background: linear-gradient(135deg, rgba(191, 93, 67, 0.12), rgba(234, 219, 200, 0.9));
      border-color: rgba(191, 93, 67, 0.2);
      transform: translateX(-2px);
    }

    .play-toggle {
      width: 100%;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--ink), #2f3d35);
      color: white;
      font-weight: 700;
      padding: 11px 16px;
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease;
      box-shadow: 0 10px 18px rgba(36, 49, 40, 0.18);
    }

    .play-toggle.is-playing {
      background: linear-gradient(135deg, var(--clay), #d18d6a);
      box-shadow: 0 10px 18px rgba(191, 93, 67, 0.28);
    }

    .play-toggle:hover {
      transform: translateY(-1px);
    }

    .ambient-notes {
      position: fixed;
      inset: 0 auto 0 0;
      width: 110px;
      pointer-events: none;
      z-index: 1;
      opacity: 0.7;
    }

    .note-icon {
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50% 50% 55% 45%;
      transform: rotate(22deg);
      animation: noteFloat 7s ease-in-out infinite;
      box-shadow: inset 0 0 14px rgba(255,255,255,0.3), 0 10px 18px rgba(191,93,67,0.12);
    }

    .note-icon::before,
    .note-icon::after {
      content: "";
      position: absolute;
      inset: auto;
    }

    .note-icon::before {
      width: 2px;
      height: 12px;
      left: 50%;
      top: -10px;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.7);
      border-radius: 999px;
    }

    .note-icon::after {
      width: 6px;
      height: 6px;
      left: 50%;
      top: -12px;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.7);
      border-radius: 50%;
    }

    .note-icon:nth-child(1) { left: 10px; top: 140px; background: linear-gradient(180deg, #f8c66e, #e7a927); animation-delay: 0.2s; }
    .note-icon:nth-child(2) { left: 28px; top: 230px; background: linear-gradient(180deg, #ff9ba8, #e05d7f); animation-delay: 0.7s; }
    .note-icon:nth-child(3) { left: 20px; top: 330px; background: linear-gradient(180deg, #a9d8ff, #5fa5ff); animation-delay: 1.2s; }
    .note-icon:nth-child(4) { left: 40px; top: 445px; background: linear-gradient(180deg, #a4e8b1, #53bd7b); animation-delay: 1.8s; }
    .note-icon:nth-child(5) { left: 26px; top: 560px; background: linear-gradient(180deg, #d2b5ff, #9478e3); animation-delay: 2.5s; }
    .note-icon:nth-child(6) { left: 16px; top: 680px; background: linear-gradient(180deg, #ffd0a6, #ea8d61); animation-delay: 3.2s; }
    .note-icon:nth-child(7) { left: 36px; top: 780px; background: linear-gradient(180deg, #9ae5d8, #49bda9); animation-delay: 3.8s; }
    .note-icon:nth-child(8) { left: 18px; top: 910px; background: linear-gradient(180deg, #f7b1d4, #dc76b0); animation-delay: 4.1s; }

    @keyframes noteFloat {
      0%, 100% { transform: translateY(0) rotate(22deg) scale(1); opacity: 0.5; }
      50% { transform: translateY(-18px) rotate(18deg) scale(1.08); opacity: 1; }
    }

    @keyframes equalize {
      0% { transform: scaleY(0.4); }
      100% { transform: scaleY(1); }
    }

    @media (max-width: 768px) {
      .gallery-card.large,
      .gallery-card.medium,
      .gallery-card.small {
        grid-column: 1 / -1;
        min-height: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="w-full px-6 py-6 md:px-12 lg:px-20">
      <nav aria-label="Navigasi utama" class="mx-auto flex max-w-7xl items-center justify-between gap-6">
        <a href="index.html" class="text-lg font-bold tracking-[0.16em]" style="color: var(--ink);">Kelompok 12</a>
        <div class="flex items-center gap-4 text-sm font-medium sm:gap-7">
          <a href="index.html" class="nav-link" style="color: var(--ink);">Home</a>
          <a href="index.html#about" class="nav-link" style="color: var(--ink);">About</a>
          <a href="gallery.html" class="nav-link" style="color: var(--ink);">Galeri</a>
        </div>
      </nav>
    </header>

    <main class="gallery-shell">
      <div class="gallery-header">
        <p>Galeri</p>
        <h1>Galeri Kegiatan Kelompok</h1>
        <p class="subtitle">Beberapa momen penting yang menggambarkan semangat kerja sama, belajar, dan kebersamaan kami dalam satu kelompok.</p>
      </div>

      <section class="folder-shell" aria-label="Folder galeri kegiatan">
        <div class="folder-list">
          <button class="folder-item active" type="button" data-target="day1-album">
            <span class="folder-tab" aria-hidden="true"></span>
            <span class="folder-copy">
              <span class="folder-number">Folder 1</span>
              <span class="folder-name">DAY 1 MABIM</span>
              <span class="folder-meta">4 foto</span>
            </span>
          </button>
        </div>

        <div class="album-panel active" id="day1-album">
          <div class="album-header">
            <h2 class="album-title">DAY 1 MABIM</h2>
            <span class="album-count">4 Foto</span>
          </div>

          <div class="gallery-grid" aria-label="Foto di DAY 1 MABIM">
            <figure class="gallery-card large">
              <img src="assets/poto1.jpeg" alt="Kegiatan pertama kelompok 12">
              <figcaption class="gallery-overlay">
                <span class="gallery-title">Diskusi Tim</span>
                <span class="gallery-tag">01</span>
              </figcaption>
            </figure>

            <figure class="gallery-card medium">
              <img src="assets/poto2.jpeg" alt="Kegiatan belajar bersama kelompok 12">
              <figcaption class="gallery-overlay">
                <span class="gallery-title">Belajar Bareng</span>
                <span class="gallery-tag">02</span>
              </figcaption>
            </figure>

            <figure class="gallery-card small">
              <img src="assets/poto3.jpeg" alt="Kegiatan kerja sama kelompok 12">
              <figcaption class="gallery-overlay">
                <span class="gallery-title">Kerja Sama</span>
                <span class="gallery-tag">03</span>
              </figcaption>
            </figure>

            <figure class="gallery-card small">
              <img src="assets/poto4.jpeg" alt="Foto bersama kelompok 12">
              <figcaption class="gallery-overlay">
                <span class="gallery-title">Bersama</span>
                <span class="gallery-tag">04</span>
              </figcaption>
            </figure>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="ambient-notes" aria-hidden="true">
    <span class="note-icon"></span>
    <span class="note-icon"></span>
    <span class="note-icon"></span>
    <span class="note-icon"></span>
    <span class="note-icon"></span>
    <span class="note-icon"></span>
    <span class="note-icon"></span>
    <span class="note-icon"></span>
  </div>

  <aside class="music-panel">
    <div class="music-head">
      <div class="music-badge">
        <div class="equalizer" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <span>Now</span>
      </div>
      <span class="status-pill" id="statusPill">Paused</span>
    </div>

    <div class="music-meta">
      <div class="album-art" aria-hidden="true"></div>
      <div>
        <p class="music-title">Current</p>
        <p class="music-track-name" id="currentTrackName">Shape of My Heart</p>
      </div>
    </div>

    <div class="music-progress" aria-label="Progress lagu">
      <div class="time-row">
        <span id="currentTimeLabel">0:00</span>
        <span id="durationLabel">0:00</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="player-controls">
      <button class="nav-btn" id="prevTrackBtn" aria-label="Lagu sebelumnya">‹</button>
      <button class="play-toggle" id="playToggle" aria-label="Putar musik">Play</button>
      <button class="nav-btn" id="nextTrackBtn" aria-label="Lagu berikutnya">›</button>
    </div>

    <div class="track-list">
      <button class="track-btn active" data-track="Shape of My Heart" data-src="assets/Backstreet Boys - Shape Of My Heart (Official HD Video).mp3">Shape of My Heart</button>
      <button class="track-btn" data-track="About You" data-src="assets/The 1975 - About You (Official).mp3">About You</button>
      <button class="track-btn" data-track="Merry Christmas I Miss You" data-src="assets/Merry Christmas, i miss you - Alex Crichton  Lirik Terjemahan Indonesia.mp3">Merry Christmas I Miss You</button>
    </div>
    <audio id="bgAudio" loop preload="auto"></audio>
  </aside>

  <script>
    const audio = document.getElementById('bgAudio');
    const buttons = [...document.querySelectorAll('.track-btn')];
    const playToggle = document.getElementById('playToggle');
    const prevTrackBtn = document.getElementById('prevTrackBtn');
    const nextTrackBtn = document.getElementById('nextTrackBtn');
    const progressTrack = document.querySelector('.progress-track');
    const musicPanel = document.querySelector('.music-panel');
    const currentTrackName = document.getElementById('currentTrackName');
    const statusPill = document.getElementById('statusPill');
    const currentTimeLabel = document.getElementById('currentTimeLabel');
    const durationLabel = document.getElementById('durationLabel');
    const progressFill = document.getElementById('progressFill');
    const STORAGE_KEY = 'mabim_music_state';

    function formatTime(totalSeconds) {
      if (!Number.isFinite(totalSeconds) || totalSeconds < 0) return '0:00';
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = Math.floor(totalSeconds % 60).toString().padStart(2, '0');
      return `${minutes}:${seconds}`;
    }

    function getSavedMusicState() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      } catch (error) {
        return {};
      }
    }

    function syncTrackLabel() {
      const activeTrack = document.querySelector('.track-btn.active');
      if (currentTrackName && activeTrack) {
        currentTrackName.textContent = activeTrack.dataset.track || 'Unknown track';
      }
    }

    function saveMusicState() {
      const activeTrack = document.querySelector('.track-btn.active');
      const state = {
        src: activeTrack ? activeTrack.dataset.src : audio.src,
        playing: !audio.paused && Boolean(audio.src),
        currentTime: Number.isFinite(audio.currentTime) ? audio.currentTime : 0
      };

      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (error) {
        console.warn('Music state could not be saved:', error);
      }
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    let dragState = null;

    musicPanel.addEventListener('pointerdown', (event) => {
      if (event.target.closest('.track-btn') || event.target.closest('.play-toggle')) {
        return;
      }

      dragState = {
        offsetX: event.clientX - musicPanel.getBoundingClientRect().left,
        offsetY: event.clientY - musicPanel.getBoundingClientRect().top
      };
      musicPanel.classList.add('dragging');
      musicPanel.setPointerCapture(event.pointerId);
    });

    musicPanel.addEventListener('pointermove', (event) => {
      if (!dragState) return;

      const maxX = window.innerWidth - musicPanel.offsetWidth - 12;
      const maxY = window.innerHeight - musicPanel.offsetHeight - 12;
      const nextLeft = clamp(event.clientX - dragState.offsetX, 12, Math.max(12, maxX));
      const nextTop = clamp(event.clientY - dragState.offsetY, 12, Math.max(12, maxY));

      musicPanel.style.left = `${nextLeft}px`;
      musicPanel.style.top = `${nextTop}px`;
      musicPanel.style.right = 'auto';
    });

    ['pointerup', 'pointercancel', 'pointerleave'].forEach((eventName) => {
      musicPanel.addEventListener(eventName, () => {
        if (!dragState) return;
        dragState = null;
        musicPanel.classList.remove('dragging');
      });
    });

    function updateProgressBar() {
      if (!Number.isFinite(audio.duration) || audio.duration <= 0) {
        durationLabel.textContent = '0:00';
        currentTimeLabel.textContent = '0:00';
        progressFill.style.width = '0%';
        return;
      }

      const progress = (audio.currentTime / audio.duration) * 100;
      progressFill.style.width = `${progress}%`;
      currentTimeLabel.textContent = formatTime(audio.currentTime);
      durationLabel.textContent = formatTime(audio.duration);
    }

    function setTrackByIndex(index) {
      const targetButton = buttons[index];
      if (!targetButton) return;
      loadTrack(targetButton);
    }

    function moveTrack(step) {
      const activeIndex = buttons.findIndex((button) => button.classList.contains('active'));
      const nextIndex = (activeIndex + step + buttons.length) % buttons.length;
      setTrackByIndex(nextIndex);
    }

    function seekTrack(event) {
      if (!Number.isFinite(audio.duration) || audio.duration <= 0) return;
      const rect = progressTrack.getBoundingClientRect();
      const ratio = clamp((event.clientX - rect.left) / rect.width, 0, 1);
      audio.currentTime = ratio * audio.duration;
      updateProgressBar();
      saveMusicState();
    }

    function updateMusicState(isPlaying) {
      playToggle.textContent = isPlaying ? 'Pause' : 'Play';
      playToggle.classList.toggle('is-playing', isPlaying);
      musicPanel.classList.toggle('playing', isPlaying);
      statusPill.textContent = isPlaying ? 'Playing' : 'Paused';
      syncTrackLabel();
      updateProgressBar();
    }

    function resumeMusicAfterInteraction() {
      if (!audio.src || !audio.paused) return;
      playAudio();
    }

    function playAudio() {
      if (!audio.src) return;
      audio.muted = false;
      audio.volume = 0.7;
      const playPromise = audio.play();
      if (playPromise && typeof playPromise.catch === 'function') {
        playPromise.catch(() => {
          document.addEventListener('pointerdown', resumeMusicAfterInteraction, { once: true });
          document.addEventListener('keydown', resumeMusicAfterInteraction, { once: true });
          updateMusicState(false);
        });
      }
      updateMusicState(!audio.paused);
      saveMusicState();
    }

    function loadTrack(button) {
      buttons.forEach((btn) => btn.classList.toggle('active', btn === button));
      audio.src = encodeURI(button.dataset.src);
      audio.load();
      audio.currentTime = 0;
      syncTrackLabel();
      playAudio();
      saveMusicState();
    }

    buttons.forEach((button) => {
      button.addEventListener('click', () => loadTrack(button));
    });

    playToggle.addEventListener('click', () => {
      if (audio.paused) {
        playAudio();
      } else {
        audio.pause();
        updateMusicState(false);
        saveMusicState();
      }
    });

    prevTrackBtn.addEventListener('click', () => moveTrack(-1));
    nextTrackBtn.addEventListener('click', () => moveTrack(1));
    progressTrack.addEventListener('click', seekTrack);

    function restoreSavedMusicState() {
      const saved = getSavedMusicState();
      const savedButton = saved.src
        ? [...buttons].find((button) => button.dataset.src === saved.src)
        : null;
      const firstTrack = savedButton || document.querySelector('.track-btn.active');

      if (!firstTrack) return;

      buttons.forEach((btn) => btn.classList.toggle('active', btn === firstTrack));
      audio.src = encodeURI(firstTrack.dataset.src);
      syncTrackLabel();
      audio.load();

      audio.addEventListener('loadedmetadata', () => {
        const savedTime = Number(saved.currentTime) || 0;
        if (Number.isFinite(audio.duration) && audio.duration > 0) {
          audio.currentTime = Math.min(savedTime, audio.duration - 0.1);
        }

        if (saved.playing) {
          const resumePlayback = () => {
            if (audio.paused) {
              playAudio();
            }
          };

          document.addEventListener('pointerdown', resumePlayback, { once: true });
          document.addEventListener('keydown', resumePlayback, { once: true });
          playAudio();
        } else {
          updateMusicState(false);
        }
      }, { once: true });
    }

    restoreSavedMusicState();

    audio.addEventListener('timeupdate', () => {
      updateProgressBar();
      saveMusicState();
    });
    audio.addEventListener('loadedmetadata', updateProgressBar);
    audio.addEventListener('play', () => saveMusicState());
    audio.addEventListener('pause', () => saveMusicState());
    window.addEventListener('beforeunload', saveMusicState);

    lucide.createIcons();
  </script>
</body>
</html>
