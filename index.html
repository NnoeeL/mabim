      const phrases = ['SATU IDEOLOGI', 'SATU SOLIDARITAS'];

      const [txt, setTxt] = useState('');
      const [isDeleting, setIsDeleting] = useState(false);

      useEffect(() => {
        const word = phrases[idx];
        const speed = isDeleting ? 40 : 90;
        const timer = setTimeout(() => {
          if (!isDeleting) {
            setTxt(word.substring(0, txt.length + 1));
            if (txt === word) {
              setTimeout(() => setIsDeleting(true), 1500);
            }
          } else {
            setTxt(word.substring(0, txt.length - 1));
            if (txt === '') {
              setIsDeleting(false);
              setIdx((idx + 1) % phrases.length);
            }
          }
        }, speed);
        return () => clearTimeout(timer);
      }, [txt, isDeleting, idx]);

                  rel: 'noopener noreferrer',
                  className: 'w-full py-3 bg-gradient-to-r from-[#833ab4] via-[#fd1d1d] to-[#fcb045] text-white font-black text-xs uppercase tracking-widest text-center rounded-xl hover:opacity-90 transition-opacity shadow-brutal-sm'
                }, `Kunjungi Instagram @${selectedMember.ig} ↗`),
                React.createElement('button', {
                  onClick: () => setSelectedMember(null),
                  className: 'w-full py-2.5 bg-neutral-100 border-2 border-black text-black text-xs font-bold uppercase rounded-xl hover:bg-black hover:text-white transition-colors shadow-brutal-xs'
                }, 'Tutup')
              )
            )
          )
        ),

        // ==================== 10. GALLERY LIGHTBOX MODAL ====================
        lightboxData && React.createElement(AnimatePresence, {},
          React.createElement('div', {
            onClick: () => setLightboxData(null),
            className: 'fixed inset-0 z-50 bg-black/70 backdrop-blur-md flex items-center justify-center p-4 font-mono'
          },
            React.createElement(motion.div, {
              initial: { opacity: 0, scale: 0.95 },
              animate: { opacity: 1, scale: 1 },
              exit: { opacity: 0, scale: 0.95 },
              onClick: (e) => e.stopPropagation(),
              className: 'max-w-4xl w-full bg-white rounded-[1.5rem] overflow-hidden p-3 shadow-2xl'
            },
              React.createElement('div', { className: 'relative max-h-[75vh] flex items-center justify-center rounded-xl overflow-hidden bg-neutral-100' },
                React.createElement('img', { src: lightboxData.src, alt: lightboxData.title, className: 'max-h-[75vh] w-auto max-w-full object-contain' }),
                React.createElement('button', {
                  onClick: () => setLightboxData(null),
                  className: 'absolute top-4 right-4 w-9 h-9 rounded-full bg-white border-2 border-black text-black font-bold flex items-center justify-center hover:bg-black hover:text-white transition-colors shadow-brutal-xs'
                }, '✕')
              ),
              React.createElement('div', { className: 'p-4' },
                React.createElement('span', { className: 'text-[10px] font-bold px-3 py-1 bg-neutral-100 border-2 border-black rounded-full uppercase' }, lightboxData.tag),
                React.createElement('h3', { className: 'text-lg font-black uppercase text-black mt-2' }, lightboxData.title),
                React.createElement('p', { className: 'text-xs text-neutral-600 mt-1 font-medium' }, lightboxData.desc)
              )
            )
          )
        ),

        // Hidden HTML5 Audio Element
        React.createElement('audio', {
          ref: audioRef,
          src: tracks[currentTrackIdx].src,
          loop: true,
          preload: 'auto'
        })

      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
    if (window.Lenis) {
      window.lenis = new window.Lenis({
        anchors: true,
        autoRaf: true,
        duration: 1.1,
        smoothWheel: true,
        respectReducedMotion: true
      });
    }
  </script>
  <script src="assets/site.js" defer></script>
</body>
</html>
